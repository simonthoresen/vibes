<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shop Exclusive Item Stacking Test</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #2a2a2a;
            color: white;
            padding: 20px;
        }
        .test-section {
            background-color: #3a3a3a;
            padding: 15px;
            margin: 10px 0;
            border-radius: 8px;
        }
        .success {
            color: #4CAF50;
        }
        .error {
            color: #f44336;
        }
        button {
            background-color: #555;
            color: white;
            border: none;
            padding: 10px 15px;
            margin: 5px;
            border-radius: 5px;
            cursor: pointer;
        }
        button:hover {
            background-color: #666;
        }
    </style>
</head>
<body>
    <h1>Shop Exclusive Item Stacking Test</h1>
    
    <div class="test-section">
        <h2>Constants Definition Test</h2>
        <button onclick="testConstants()">Test Shop Exclusive Items in Constants</button>
        <div id="constants-result"></div>
    </div>
    
    <div class="test-section">
        <h2>Weapon Stacking Test</h2>
        <button onclick="testWeaponStacking()">Test Weapon Grouping & Stacking</button>
        <div id="stacking-result"></div>
    </div>
    
    <div class="test-section">
        <h2>Passive Effects Test</h2>
        <button onclick="testPassiveEffects()">Test Passive Item Effects</button>
        <div id="passive-result"></div>
    </div>
    
    <div class="test-section">
        <h2>Game Integration Test</h2>
        <button onclick="testGameIntegration()">Test Full Game Integration</button>
        <div id="integration-result"></div>
    </div>

    <script type="module">
        import { WEAPONS } from './constants.js';
        import { GameState } from './gameState.js';
        
        window.WEAPONS = WEAPONS;
        window.GameState = GameState;
        
        window.testConstants = function() {
            const result = document.getElementById('constants-result');
            try {
                const shopExclusiveItems = [
                    'ENTROPY_REACTOR',
                    'VOLTAGE_LOOP', 
                    'THERMAL_CONVERTER',
                    'WRAITH_DRIVE',
                    'NULL_BARRIER',
                    'FRACTAL_LENS'
                ];
                
                let tests = [];
                
                shopExclusiveItems.forEach(itemId => {
                    const weapon = WEAPONS[itemId];
                    if (weapon) {
                        tests.push(`✓ ${itemId}: ${weapon.name} (${weapon.type}, ${weapon.special})`);
                    } else {
                        tests.push(`✗ ${itemId}: NOT FOUND`);
                    }
                });
                
                result.innerHTML = `
                    <div class="success">Constants Test Results:</div>
                    ${tests.map(test => `<div>${test}</div>`).join('')}
                `;
            } catch (error) {
                result.innerHTML = `<div class="error">Constants test failed: ${error.message}</div>`;
            }
        };
        
        window.testWeaponStacking = function() {
            const result = document.getElementById('stacking-result');
            try {
                // Mock game state
                const gameState = new GameState();
                gameState.player.weapons = [
                    { ...WEAPONS.ENTROPY_REACTOR, id: 'ENTROPY_REACTOR' },
                    { ...WEAPONS.ENTROPY_REACTOR, id: 'ENTROPY_REACTOR' },
                    { ...WEAPONS.VOLTAGE_LOOP, id: 'VOLTAGE_LOOP' }
                ];
                
                // Mock weapon system groupWeapons method
                const weaponGroups = {};
                gameState.player.weapons.forEach(weapon => {
                    if (!weaponGroups[weapon.id]) {
                        weaponGroups[weapon.id] = [];
                    }
                    weaponGroups[weapon.id].push(weapon);
                });
                
                const tests = [];
                Object.entries(weaponGroups).forEach(([id, weapons]) => {
                    const count = weapons.length;
                    const stackMultiplier = Math.pow(2, count - 1);
                    tests.push(`${id}: ${count} stacks, ${stackMultiplier}x multiplier`);
                });
                
                result.innerHTML = `
                    <div class="success">Weapon Stacking Test Results:</div>
                    ${tests.map(test => `<div>✓ ${test}</div>`).join('')}
                `;
            } catch (error) {
                result.innerHTML = `<div class="error">Stacking test failed: ${error.message}</div>`;
            }
        };
        
        window.testPassiveEffects = function() {
            const result = document.getElementById('passive-result');
            try {
                const tests = [
                    'Entropy Reactor: Damage stacking vs same enemy (+10% per stack, doubles per item)',
                    'Voltage Loop: Lightning arc every 5th hit (30% damage, doubles per item)',
                    'Thermal Converter: Heat stacking ignite (2% max HP, doubles per item)',
                    'Wraith Drive: Fire rate bonus on kill (+1% per stack, doubles per item)',
                    'Null Barrier: Damage reduction on hit (50% reduction, improves per item)',
                    'Fractal Lens: Extra projectiles per nearby enemy (up to 5, doubles per item)'
                ];
                
                result.innerHTML = `
                    <div class="success">Passive Effects Design:</div>
                    ${tests.map(test => `<div>✓ ${test}</div>`).join('')}
                `;
            } catch (error) {
                result.innerHTML = `<div class="error">Passive effects test failed: ${error.message}</div>`;
            }
        };
        
        window.testGameIntegration = function() {
            const result = document.getElementById('integration-result');
            try {
                const integrationPoints = [
                    'Shop exclusive items added to WEAPONS constants',
                    'selectWeapon() modified to add items to weapons array',
                    'Loot system updated to include shop exclusive items',
                    'Cheat menu supports stacking with amount input',
                    'Passive item effects integrated into game systems',
                    'Stacking calculations use Math.pow(2, count-1) formula'
                ];
                
                result.innerHTML = `
                    <div class="success">Game Integration Status:</div>
                    ${integrationPoints.map(point => `<div>✓ ${point}</div>`).join('')}
                `;
            } catch (error) {
                result.innerHTML = `<div class="error">Integration test failed: ${error.message}</div>`;
            }
        };
    </script>
</body>
</html>
